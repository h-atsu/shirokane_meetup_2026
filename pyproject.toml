[project]
name = "shirokane-meetup-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "h-atsu", email = "jhuim08@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "descartes-mip>=0.2.1",
    "mlflow>=3.18.0",
    "nbformat>=5.11.1",
    "numpy>=2.0.0",
    "omegaconf>=2.4.0",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pulp[cbc,highs,scip]>=4.2.0",
    "typer>=0.29.0",
    "zensical>=0.1.1",
]

[project.scripts]
shirokane-meetup-2026 = "shirokane_meetup_2026:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]
